version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The browser demo runs the versions that @stlite/browser 1.12.0 ships; these four change only
      # together with stlite (docs/handover.md, update checklist).
      - dependency-name: streamlit
      - dependency-name: pandas
      - dependency-name: altair
      - dependency-name: openpyxl
    groups:
      dev-tools:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      # The image stays on Python 3.12 (ADR 0004); digest updates of 3.12-slim still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
